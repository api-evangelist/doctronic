aid: doctronic
name: Doctronic
description: >-
  Doctronic is a consumer telemedicine platform that pairs an AI doctor with
  licensed physicians for anonymous, low-cost health care. Users describe their
  symptoms to an AI assistant that performs a free symptom assessment and health
  consultation, then can escalate to a real doctor for a video visit ($39/visit),
  prescription refills, lab orders, and follow-up care. Positioned as "Free.
  Anonymous. Built by doctors," the product is direct-to-consumer web and mobile
  rather than a developer platform: it publishes no public API, SDK, or developer
  documentation. The only public machine-readable surface is an RFC 9116
  security.txt with a coordinated vulnerability-disclosure policy. Backed by
  Lightspeed Venture Partners and Union Square Ventures.
